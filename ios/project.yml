# Xcode プロジェクトの設計図（XcodeGen 用）
#
#   brew install xcodegen
#   cd ios && xcodegen generate     # → OniGame.xcodeproj ができる（Git 管理外）
#
# .xcodeproj を手で書くと壊れやすく差分も読みにくいので、この YAML から作る。
name: OniGame
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
  OniGameCore:
    path: OniGameCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OniGame:
    type: application
    platform: iOS
    sources:
      - path: OniGame
    dependencies:
      - package: OniGameCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseFunctions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.onigame # 自分のものに変える（Firebase コンソールの iOS アプリと同じにする）
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: OniGame/Info.plist
      properties:
        CFBundleDisplayName: リアル鬼ごっこ
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # 位置情報の利用目的（許可ダイアログに表示される）
        NSLocationWhenInUseUsageDescription: ゲーム中に、あなたの位置をゲームの判定（確保・ミッション）に使います。鬼には正確な位置ではなく、ぼかした円だけが見えます。
        # ゲーム中は画面を消しても位置を送れるようにする（ゲーム終了で止める）
        UIBackgroundModes: [location]
        # 招待リンク onigame://join?code=1234
        CFBundleURLTypes:
          - CFBundleURLName: com.example.onigame.invite
            CFBundleURLSchemes: [onigame]
        # Firebase Emulator（http://Mac の IP:ポート）に接続するため。本番は https なので影響しない
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # ---- アプリの設定（App/AppConfig.swift）----
        OniBackend: firebase          # firebase（オンライン）/ local（端末内モード＝開発用）
        OniFirebaseMode: emulator     # emulator（Mac のエミュレーター）/ production（本番。GoogleService-Info.plist が必要）
        OniEmulatorHost: 127.0.0.1    # 実機で試すときは Mac の IP アドレス（例: 192.168.0.10）
        OniFunctionsRegion: asia-northeast1

schemes:
  OniGame:
    build:
      targets:
        OniGame: all
    run:
      config: Debug
    test:
      config: Debug
