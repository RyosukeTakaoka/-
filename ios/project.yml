# Xcode プロジェクトの設計図（XcodeGen 用）
#
# OniGame.xcodeproj はこの YAML から作ったものをリポジトリに入れてあるので、ふだんは git pull だけでよい。
# ファイルの追加・設定の変更は、この YAML を直してから xcodegen generate で作り直し、.xcodeproj ごとコミットする。
name: OniGame
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  xcodeVersion: "26.0" # 「Update to recommended settings」の案内を出さないため

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  OniGameCore:
    path: OniGameCore

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  OniGame:
    type: application
    platform: iOS
    sources:
      - path: OniGame
    # Team と Bundle Identifier は Config/Signing.xcconfig（共有の既定値）と
    # Config/Local.xcconfig（自分用・Git 管理外）で決める。ここ（target の settings）には書かない
    # （ここに書くと xcconfig より優先され、自分用の設定が効かなくなるため）
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: OniGameCore
      - package: Supabase
        product: Supabase
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # Assets.xcassets/AppIcon（1024×1024 の1枚から各サイズを自動で作る）
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: OniGame/Info.plist
      properties:
        CFBundleDisplayName: リアル鬼ごっこ
        CFBundleDevelopmentRegion: ja
        CFBundleIconName: AppIcon
        # バージョンとビルド番号は Info.plist に直接書かず、ビルド設定（Config/*.xcconfig）から入れる
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # 位置情報の利用目的（許可ダイアログに表示される）
        NSLocationWhenInUseUsageDescription: ゲーム中に、あなたの位置をゲームの判定（確保・ミッション）に使います。鬼には正確な位置ではなく、ぼかした円だけが見えます。
        # ゲーム中は画面を消しても位置を送れるようにする（ゲーム終了で止める）
        UIBackgroundModes: [location]
        # 招待リンク onigame://join?code=1234
        CFBundleURLTypes:
          - CFBundleURLName: onigame.invite
            CFBundleURLSchemes: [onigame]
        # ローカルの Supabase（http://Mac の IP:54321）に接続するため。本番は https なので影響しない
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # ---- アプリの設定（App/AppConfig.swift）----
        OniBackend: online            # online（オンライン・Supabase）/ local（端末内モード＝開発用）
        OniSupabaseMode: emulator     # emulator（Mac の supabase start）/ production（本番）
        OniEmulatorHost: 127.0.0.1    # 実機で試すときは Mac の IP アドレス（例: 192.168.0.10）
        # 本番用（production のときだけ使う）。Supabase の Project Settings → API の値
        # OniSupabaseUrl: https://xxxxxxxxxxxx.supabase.co
        # OniSupabaseAnonKey: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

schemes:
  OniGame:
    build:
      targets:
        OniGame: all
    run:
      config: Debug
    test:
      config: Debug
